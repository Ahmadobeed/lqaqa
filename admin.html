<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | Al-Qaqa</title>
<style>
:root{--bg:#0a1020;--card:#131c33;--line:#243152;--text:#e8edf8;--mute:#8d9bbd;--blue:#3b82f6;--red:#ef4444;--green:#22c55e}
@media (prefers-color-scheme:light){:root{--bg:#f3f6fc;--card:#fff;--line:#d9e1f0;--text:#13203a;--mute:#5b6b8c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input,button{font:inherit}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);margin:6px 0}
button{padding:9px 14px;border-radius:10px;border:0;background:var(--blue);color:#fff;cursor:pointer}
button.red{background:var(--red)}button.gray{background:var(--line);color:var(--text)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--mute);font-weight:600}
.av{width:42px;height:42px;border-radius:50%;background:var(--line);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.msg{color:var(--mute);font-size:13px;margin:6px 0;white-space:pre-wrap}
.err{color:var(--red)}
pre{background:rgba(127,127,127,.12);padding:10px;border-radius:10px;overflow:auto;direction:ltr;text-align:left;font-size:12px;max-height:260px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
 <h1>لوحة التحكم · Al-Qaqa</h1>

 <div id="login" class="card hidden">
  <div class="msg">سجّل دخول بحساب المشرف.</div>
  <button id="gBtn">دخول بحساب Google</button>
  <div style="margin-top:12px" class="msg">او بالإيميل:</div>
  <input id="em" type="email" dir="ltr" placeholder="email">
  <input id="pw" type="password" dir="ltr" placeholder="password">
  <button id="eBtn">دخول</button>
  <div id="lerr" class="msg err"></div>
 </div>

 <div id="denied" class="card hidden">
  <div id="dmsg" class="msg err"></div>
  <div class="row"><button id="verBtn" class="gray hidden">ابعت رابط تفعيل الإيميل</button><button id="out1" class="gray">تسجيل خروج</button></div>
 </div>

 <div id="panel" class="hidden">
  <div class="card">
   <div class="row" style="justify-content:space-between">
    <div><b id="who"></b><div class="msg" id="count"></div></div>
    <div class="row"><button id="reload" class="gray">تحديث</button><button id="out2" class="gray">خروج</button></div>
   </div>
  </div>

  <div class="card tw">
   <table>
    <thead><tr><th>الصورة</th><th>الاسم</th><th>اللقب</th><th>اسم المستخدم</th><th>الإيميل</th><th>تاريخ التسجيل</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="msg">عم يحمّل...</td></tr></tbody>
   </table>
  </div>

  <div class="card">
   <b>حذف حساب بالإيميل (Auth + Firestore)</b>
   <div class="msg">للحسابات اللي ما إلها مستند بـ Firestore او مشان تحذف حسابك القديم.</div>
   <div class="row"><input id="delEmail" type="email" dir="ltr" placeholder="email" style="flex:1;min-width:220px"><button id="delByEmail" class="red">حذف</button></div>
  </div>

  <div class="card">
   <b>أدوات التنظيف</b>
   <div class="row" style="margin-top:8px">
    <button id="anonCheck" class="gray">عدّ الحسابات المجهولة</button>
    <button id="anonDel" class="red">حذف كل المجهولين</button>
   </div>
   <div class="row" style="margin-top:8px">
    <button id="syncCheck" class="gray">فحص Auth ↔ Firestore</button>
    <button id="syncBackfill">إنشاء مستند للناقصين</button>
    <button id="syncDelete" class="red">حذف اليتامى من الطرفين</button>
   </div>
   <pre id="log" class="hidden"></pre>
  </div>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
var ADMIN_EMAIL='ahmadobeed2007@gmail.com';
firebase.initializeApp({apiKey:'AIzaSyAaklzt1UpQ2GRBMu9YrjoJk8LbdNXoF7Q',authDomain:'al-qaqa-bd1b7.firebaseapp.com',projectId:'al-qaqa-bd1b7',storageBucket:'al-qaqa-bd1b7.firebasestorage.app',messagingSenderId:'815526380054',appId:'1:815526380054:web:f40638ce40b958043aeb37'});
var auth=firebase.auth(),db=firebase.firestore(),fn=firebase.functions();
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function show(id,on){$(id).classList.toggle('hidden',!on)}
function call(name,data){return fn.httpsCallable(name)(data||{}).then(function(r){return r.data})}
function log(o){var p=$('log');p.classList.remove('hidden');p.textContent=typeof o==='string'?o:JSON.stringify(o,null,2)}
function errMsg(e){return (e&&e.message)||String(e)}

auth.onAuthStateChanged(function(u){
 show('login',false);show('denied',false);show('panel',false);
 if(!u||u.isAnonymous){show('login',true);return}
 var okMail=(u.email||'').toLowerCase()===ADMIN_EMAIL;
 if(!okMail){$('dmsg').textContent='هاد الحساب ('+u.email+') ما إلو صلاحية.';show('verBtn',false);show('denied',true);return}
 if(!u.emailVerified){$('dmsg').textContent='لازم تفعّل الإيميل اول (او فوت بحساب Google).';show('verBtn',true);show('denied',true);return}
 $('who').textContent=u.email;show('panel',true);load();
});

$('gBtn').onclick=function(){var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).catch(function(e){$('lerr').textContent=errMsg(e)})};
$('eBtn').onclick=function(){auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(function(e){$('lerr').textContent='الإيميل او كلمة المرور غلط'})};
$('out1').onclick=$('out2').onclick=function(){auth.signOut()};
$('verBtn').onclick=function(){auth.currentUser.sendEmailVerification().then(function(){alert('انبعت الرابط على إيميلك')}).catch(function(e){alert(errMsg(e))})};
$('reload').onclick=load;

function fmt(ts){try{return ts&&ts.toDate?ts.toDate().toLocaleString('ar-SY',{dateStyle:'medium',timeStyle:'short'}):'-'}catch(e){return'-'}}
function load(){
 $('rows').innerHTML='<tr><td colspan="7" class="msg">عم يحمّل...</td></tr>';
 db.collection('users').orderBy('createdAt','desc').get().then(function(s){
  $('count').textContent='عدد المستخدمين: '+s.size;
  if(!s.size){$('rows').innerHTML='<tr><td colspan="7" class="msg">ما في مستخدمين</td></tr>';return}
  var h='';
  s.forEach(function(d){var x=d.data();
   var pic=x.photoURL&&/^(https:|data:image\/)/.test(x.photoURL)?'<img class="av" src="'+esc(x.photoURL)+'" alt="">':'<div class="av">👤</div>';
   h+='<tr><td>'+pic+'</td><td>'+esc(x.firstName)+'</td><td>'+esc(x.lastName)+'</td><td class="ltr">@'+esc(x.username)+'</td><td class="ltr">'+esc(x.email)+'</td><td>'+esc(fmt(x.createdAt))+'</td><td><button class="red" data-uid="'+esc(d.id)+'" data-name="'+esc(x.username)+'" data-mail="'+esc(x.email)+'">حذف</button></td></tr>'});
  $('rows').innerHTML=h;
 }).catch(function(e){$('rows').innerHTML='<tr><td colspan="7" class="msg err">'+esc(errMsg(e))+'</td></tr>'});
}
$('rows').onclick=function(ev){
 var b=ev.target.closest('button[data-uid]');if(!b)return;
 var mail=b.dataset.mail,self=(mail||'').toLowerCase()===ADMIN_EMAIL;
 if(!confirm('حذف @'+b.dataset.name+' ('+mail+') نهائياً من Auth و Firestore؟'+(self?'\nهاد حسابك انت!':'')))return;
 b.disabled=true;
 call('deleteUserCompletely',{uid:b.dataset.uid,confirmSelf:self}).then(function(){load()}).catch(function(e){alert(errMsg(e));b.disabled=false});
};
$('delByEmail').onclick=function(){
 var m=$('delEmail').value.trim();if(!m)return;
 var self=m.toLowerCase()===ADMIN_EMAIL;
 if(!confirm('حذف '+m+' نهائياً من Auth و Firestore؟'+(self?'\nهاد حسابك انت، رح تنطرد من اللوحة.':'')))return;
 call('deleteUserCompletely',{email:m,confirmSelf:self}).then(function(r){log(r);load()}).catch(function(e){alert(errMsg(e))});
};
$('anonCheck').onclick=function(){call('cleanupAnonymous',{dryRun:true}).then(log).catch(function(e){log(errMsg(e))})};
$('anonDel').onclick=function(){if(!confirm('حذف كل الحسابات المجهولة (بدون إيميل)؟'))return;call('cleanupAnonymous',{}).then(log).catch(function(e){log(errMsg(e))})};
$('syncCheck').onclick=function(){call('syncAuthFirestore',{apply:false}).then(log).catch(function(e){log(errMsg(e))})};
$('syncBackfill').onclick=function(){if(!confirm('إنشاء مستند Firestore للحسابات الموجودة بـ Auth فقط، وحذف مستندات Firestore بدون حساب؟'))return;call('syncAuthFirestore',{apply:true,authOnly:'backfill'}).then(function(r){log(r);load()}).catch(function(e){log(errMsg(e))})};
$('syncDelete').onclick=function(){if(!confirm('حذف حسابات Auth اللي ما إلها مستند Firestore + مستندات Firestore اللي ما إلها حساب؟ (نهائي)'))return;call('syncAuthFirestore',{apply:true,authOnly:'delete'}).then(function(r){log(r);load()}).catch(function(e){log(errMsg(e))})};
</script>
</body>
</html>
